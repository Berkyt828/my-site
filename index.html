<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-ru="Главная" data-en="Home">Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="active" data-ru="Главная" data-en="Home">Главная</a>
            <a href="about.html" data-ru="Обо мне" data-en="About">Обо мне</a>
            <a href="contacts.html" data-ru="Контакты" data-en="Contacts">Контакты</a>
        </nav>
        <div class="controls">
            <button id="lang-btn" title="Сменить язык">EN</button>
            <button id="theme-btn" title="Сменить тему">🌙</button>
        </div>
    </header>

    <main>
        <h1 data-ru="Привет, мир! 👋" data-en="Hello, world! 👋">Привет, мир! 👋</h1>
        <p data-ru="Это мой первый сайт на GitHub Pages" data-en="This is my first site on GitHub Pages">Это мой первый сайт на GitHub Pages</p>

        <button id="counter-btn" data-ru="Нажми меня" data-en="Click me">Нажми меня</button>
        <p id="counter-text"><span data-ru="Нажатий" data-en="Clicks">Нажатий</span>: <span id="counter">0</span></p>
        <button id="notify-btn" style="margin-top:20px;padding:12px 30px;font-size:1.1em;border:none;border-radius:8px;background:#fff;color:#764ba2;cursor:pointer;">🔔 Уведомить бота</button>
    </main>

    <footer>
        <p>© 2025 <span data-ru="Мой сайт" data-en="My site">Мой сайт</span></p>
    </footer>

    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>
document.getElementById('notify-btn').addEventListener('click', async () => {
  try {
    const r = await fetch('https://telegram-bot-2flj.onrender.com/notify');
    const data = await r.json();
    if (data.ok) {
      alert('Бот уведомлён!');
    } else {
      alert('Ошибка: ' + JSON.stringify(data));
    }
  } catch (e) {
    alert('Ошибка сети: ' + e);
  }
});
</script>
</body>
</html>
